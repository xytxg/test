name: STV
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
  TARGETED_DEVICE_FAMILY: "1,2"
packages:
  TDLibKit:
    url: https://github.com/Swiftgram/TDLibKit
    exactVersion: 1.5.2-tdlib-1.8.69-6126ecae
  QuickJS:
    path: Packages/QuickJS
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine
    from: 7.62.0
targets:
  STV:
    type: application
    platform: iOS
    sources:
      - STV
    dependencies:
      - package: TDLibKit
      - package: QuickJS
        product: CQuickJS
      - package: AetherEngine
        product: AetherEngine
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.xylyra.iduanju
      GENERATE_INFOPLIST_FILE: YES
      MARKETING_VERSION: "1.5.1"
      CURRENT_PROJECT_VERSION: "15"
      SWIFT_EMIT_LOC_STRINGS: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    postBuildScripts:
      - name: Bundle GPL license and fork attribution
        basedOnDependencyAnalysis: false
        script: |
          cp "$SRCROOT/LICENSE" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/iDuanJu-GPL-3.0.txt"
          cp "$SRCROOT/FORK-NOTICE.md" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/iDuanJu-FORK-NOTICE.md"
      - name: Debug-only local color-bar fixture
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            cp "$SRCROOT/STVTests/Fixtures/player_landscape.mp4" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ui_color_bars.mp4"
            cp "$SRCROOT/STVTests/Fixtures/novel_sample_gbk.txt" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/novel_sample_gbk.txt"
            mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ui_legado"
            cp -R "$SRCROOT/STVTests/Fixtures/legado/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ui_legado/"
            mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ui_novel_preview"
            cp -R "$SRCROOT/STVTests/Fixtures/ui_novel_preview/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ui_novel_preview/"
          fi
    info:
      path: STV/Info.plist
      properties:
        CFBundleDisplayName: i短剧 XY
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: 用于解锁「片源管理」里隐藏的长视频片源
        NSPhotoLibraryAddUsageDescription: 用于把你下载的图片和视频保存到相册
        LSApplicationQueriesSchemes: [tg]
        NSAppTransportSecurity:
          # 「阅读」书源: many novel sites are http-only. (NSAllowsLocalNetworking must not be set alongside:
          # iOS then ignores NSAllowsArbitraryLoads. Arbitrary loads already include the local proxy.)
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  STVTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: STVTests
        includes:
          - "**/*.swift"
      # Preserve fixture subdirectories (000.bin/routes.json recur per source); never flatten or omit them.
      - path: STVTests/Fixtures
        type: folder
    dependencies:
      - target: STV
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.xylyra.iduanjuTests
  STVUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - STVUITests
    dependencies:
      - target: STV
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.xylyra.iduanjuUITests
      TEST_TARGET_NAME: STV
schemes:
  STV:
    build:
      targets:
        STV: all
        STVTests: [test]
        STVUITests: [test]
    test:
      targets:
        - STVTests
        - STVUITests
