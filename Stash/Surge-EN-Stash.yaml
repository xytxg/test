# Surge-EN for Stash (2026-11-03)
# Based on https://github.com/Rabbit-Spec/Surge/blob/Master/Conf/Spec/Surge-EN.conf
# Stash native YAML. Public profile contains NO private subscription URLs.
# To add nodes securely, install the locally edited subscription-override.example.stoverride.
# Rules keep the original Surge-EN order; big Proxy/ChinaCIDR rules are optimized.

mode: rule
log-level: warning
ipv6: false

dns:
  enable: true
  ipv6: false
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fake-ip-filter:
    - "*.msftncsi.com"
    - "*.msftconnecttest.com"
    - "*.srv.nintendo.net"
    - "*.stun.playstation.net"
    - "xbox.*.microsoft.com"
    - "*.xboxlive.com"
    - "*.battlenet.com.cn"
    - "*.battlenet.com"
    - "*.blzstatic.cn"
    - "*.battle.net"
    - "*.turn.twilio.com"
    - "*.stun.twilio.com"
    - "stun.syncthing.net"
    - "stun.*"
    - "127.*.*.*.sslip.io"
    - "127-*-*-*.sslip.io"
    - "*.127.*.*.*.sslip.io"
    - "*-127-*-*-*.sslip.io"
    - "127.*.*.*.nip.io"
    - "127-*-*-*.nip.io"
    - "*.127.*.*.*.nip.io"
    - "*-127-*-*-*.nip.io"
    - "localhost"
    - "*.local"

proxy-groups:
  - name: "Proxy"
    type: select
    proxies:
      - "香港节点"
      - "美国节点"
      - "日本节点"
      - "韩国节点"
      - "台湾节点"
      - "新加坡节点"
      - "我的节点"
      - "DIRECT"
    icon: "https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Surge.png"
  - name: "Apple"
    type: select
    proxies:
      - "DIRECT"
      - "Proxy"
      - "香港节点"
      - "美国节点"
      - "日本节点"
      - "韩国节点"
      - "新加坡节点"
    icon: "https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Apple_Arcade.png"
  - name: "AIGC"
    type: select
    proxies:
      - "Proxy"
      - "香港节点"
      - "美国节点"
      - "日本节点"
      - "韩国节点"
      - "新加坡节点"
    icon: "https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/ChatGPT.png"
  - name: "Telegram"
    type: select
    proxies:
      - "Proxy"
      - "香港节点"
      - "美国节点"
      - "日本节点"
      - "韩国节点"
      - "新加坡节点"
    icon: "https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Telegram.png"
  - name: "Netflix"
    type: select
    proxies:
      - "Proxy"
      - "香港节点"
      - "美国节点"
      - "日本节点"
      - "韩国节点"
      - "新加坡节点"
    icon: "https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Netflix.png"
  - name: "Disney+"
    type: select
    proxies:
      - "Proxy"
      - "香港节点"
      - "美国节点"
      - "日本节点"
      - "韩国节点"
      - "新加坡节点"
    icon: "https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Disney.png"
  - name: "YouTube"
    type: select
    proxies:
      - "Proxy"
      - "香港节点"
      - "美国节点"
      - "日本节点"
      - "韩国节点"
      - "新加坡节点"
    icon: "https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/YouTube.png"
  - name: "Spotify"
    type: select
    proxies:
      - "Proxy"
      - "香港节点"
      - "美国节点"
      - "日本节点"
      - "韩国节点"
      - "新加坡节点"
    icon: "https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Spotify.png"
  - name: "TikTok"
    type: select
    proxies:
      - "Proxy"
      - "香港节点"
      - "美国节点"
      - "日本节点"
      - "韩国节点"
      - "新加坡节点"
    icon: "https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/TikTok.png"
  - name: "BiliBili"
    type: select
    proxies:
      - "DIRECT"
      - "香港节点"
      - "台湾节点"
    icon: "https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Bilibili.png"
  - name: "GlobalMedia"
    type: select
    proxies:
      - "Proxy"
      - "香港节点"
      - "美国节点"
      - "日本节点"
      - "韩国节点"
      - "新加坡节点"
    icon: "https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/GlobalMedia.png"
  - name: "Microsoft"
    type: select
    proxies:
      - "DIRECT"
      - "Proxy"
      - "香港节点"
      - "美国节点"
      - "日本节点"
      - "韩国节点"
      - "新加坡节点"
    icon: "https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Windows.png"
  - name: "Game"
    type: select
    proxies:
      - "DIRECT"
      - "Proxy"
      - "香港节点"
      - "美国节点"
      - "日本节点"
      - "韩国节点"
      - "新加坡节点"
    icon: "https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Game.png"
  - name: "香港节点"
    type: url-test
    include-all: true
    filter: "(?i)(🇭🇰|香港|Hong[\\s_-]*Kong|\\bHK\\b)"
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 120
    lazy: true
    icon: "https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Country-Hong_Kong.png"
  - name: "美国节点"
    type: url-test
    include-all: true
    filter: "(?i)(🇺🇸|美国|United[\\s_-]*States|\\bUS\\b|\\bUSA\\b)"
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 120
    lazy: true
    icon: "https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Country-United_States.png"
  - name: "日本节点"
    type: url-test
    include-all: true
    filter: "(?i)(🇯🇵|日本|Japan|\\bJP\\b)"
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 120
    lazy: true
    icon: "https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Country-Japan.png"
  - name: "韩国节点"
    type: url-test
    include-all: true
    filter: "(?i)(🇰🇷|韩国|Korea|\\bKR\\b)"
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 120
    lazy: true
    icon: "https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Country-South_Korea.png"
  - name: "台湾节点"
    type: url-test
    include-all: true
    filter: "(?i)(🇹🇼|台湾|台灣|Taiwan|\\bTW\\b)"
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 120
    lazy: true
    icon: "https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Country-China.png"
  - name: "新加坡节点"
    type: url-test
    include-all: true
    filter: "(?i)(🇸🇬|新加坡|Singapore|\\bSG\\b)"
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 120
    lazy: true
    icon: "https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Country-Singapore.png"
  - name: "我的节点"
    type: select
    include-all: true
    icon: "https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Proxy.png"

