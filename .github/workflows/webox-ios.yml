name: WeBox iOS unsigned IPA
on:
  push:
    branches: [main]
    paths: ['WeBox-iOS/**', '.github/workflows/webox-ios.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: webox-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 50
    defaults:
      run:
        working-directory: WeBox-iOS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check all three source protocols
        run: node Scripts/check-source.mjs
      - name: Verify iOS 27 SDK and generate project
        run: |
          xcodebuild -version
          xcodebuild -showsdks | tee sdks.log
          grep -q 'iphoneos27' sdks.log
          brew install xcodegen
          xcodegen generate
      - name: Compile simulator app and tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project WeBox.xcodeproj -scheme WeBox \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO | tee build-compile.log
          test -f build/simulator/Build/Products/Debug-iphonesimulator/WeBox.app/source-adapter.js
          test -f build/simulator/Build/Products/Debug-iphonesimulator/WeBox.app/sdk-webox.js
          test ! -f build/simulator/Build/Products/Debug-iphonesimulator/WeBox.app/hongguo.webox.js
      - name: Start local media fixtures
        run: |
          bash Scripts/test-tls-cert.sh build/test-tls
          python3 Scripts/fixture-server.py build/test-tls > fixture-server.log 2>&1 &
          echo "$!" > build/fixture-server.pid
          python3 - <<'PY'
          import urllib.request,time
          for attempt in range(20):
              try:
                  req=urllib.request.Request('http://127.0.0.1:8765/sample.mp4',headers={'Range':'bytes=0-15'})
                  with urllib.request.urlopen(req,timeout=2) as r:
                      assert r.status==206 and len(r.read())==16
                  break
              except Exception:
                  if attempt==19: raise
                  time.sleep(.2)
          PY
      - name: Select iOS 27 simulator
        id: sim
        run: |
          xcrun simctl list devices available -j > simulator-devices.json
          SIMULATOR_ID=$(python3 - <<'PY'
          import json
          d=json.load(open('simulator-devices.json'))
          rows=[v for key,vs in d['devices'].items() if 'iOS-27' in key for v in vs if 'iPhone' in v['name']]
          assert rows,'iOS 27 iPhone simulator is required'
          rows.sort(key=lambda v:('Pro Max' not in v['name'],'Pro' not in v['name'],v['name']))
          print(rows[0]['udid'])
          PY
          )
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$SIMULATOR_ID" || true
      - name: Test imports, source contracts, media cache and actual AVPlayer playback
        timeout-minutes: 24
        run: |
          set -o pipefail
          xcrun simctl bootstatus '${{ steps.sim.outputs.id }}' -b
          xcrun simctl keychain '${{ steps.sim.outputs.id }}' add-root-cert build/test-tls/root.pem
          xcodebuild test-without-building -project WeBox.xcodeproj -scheme WeBox \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.id }}' \
            -retry-tests-on-failure -test-iterations 3 -test-repetition-relaunch-enabled YES \
            -parallel-testing-enabled NO -derivedDataPath build/simulator \
            -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO | tee build-test.log
      - name: Capture iOS 27 glass UI and player screenshots
        timeout-minutes: 12
        run: bash Scripts/screenshots.sh '${{ steps.sim.outputs.id }}' build/simulator/Build/Products/Debug-iphonesimulator/WeBox.app build/screenshots
      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild build -project WeBox.xcodeproj -scheme WeBox -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' | tee build-device.log
      - name: Verify source-free app and package IPA
        run: |
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/WeBox.app build/package/Payload/
          test ! -d build/package/Payload/WeBox.app/_CodeSignature
          test ! -f build/package/Payload/WeBox.app/embedded.mobileprovision
          file build/package/Payload/WeBox.app/WeBox | grep arm64
          python3 - <<'PY'
          from pathlib import Path
          root=Path('build/package/Payload/WeBox.app')
          allowed={'bridge.js','source-adapter.js','compute-worker.js','sdk-cheerio.js','sdk-cryptojs.js','sdk-webox.js','sdk-widget.js','sdk-xptv.js'}
          actual={p.name for p in root.rglob('*.js')}
          assert actual==allowed,actual
          assert not list(root.rglob('*.webox.js'))
          assert not list(root.rglob('sample.mp4'))
          assert not list(root.rglob('portrait.mp4'))
          print('PASS: runtime libraries only; no bundled content source or test media')
          PY
          cd build/package
          /usr/bin/zip -qry ../WeBox-iOS-unsigned.ipa Payload
          cd ..
          unzip -t WeBox-iOS-unsigned.ipa
          shasum -a 256 WeBox-iOS-unsigned.ipa > SHA256SUMS.txt
          /usr/bin/zip -qry WeBox-iOS-screenshots.zip screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: WeBox-iOS-unsigned
          path: |
            WeBox-iOS/build/WeBox-iOS-unsigned.ipa
            WeBox-iOS/build/SHA256SUMS.txt
            WeBox-iOS/build/screenshots/*.png
            WeBox-iOS/build/WeBox-iOS-screenshots.zip
          retention-days: 30
      - name: Publish downloadable beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="webox-ios-0.2.5-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "WeBox iOS 0.2.5 · 全屏播放器 · build ${GITHUB_RUN_NUMBER}" \
            --notes-file docs/RELEASE-0.2.5.md --prerelease \
            build/WeBox-iOS-unsigned.ipa build/SHA256SUMS.txt build/WeBox-iOS-screenshots.zip build/screenshots/*.png
      - name: Save diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: WeBox-iOS-diagnostics
          path: |
            WeBox-iOS/*.log
            WeBox-iOS/simulator-devices.json
            WeBox-iOS/build/Tests.xcresult
            WeBox-iOS/build/screenshots/*.png
          retention-days: 7
